limit_req_zone $binary_remote_addr zone=account_login:10m rate=10r/m;
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location = /api/auth {
        limit_req zone=account_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://formflow:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://formflow:8080;
        proxy_http_version 1.1;
        # Preserve the browser-facing port so same-origin POST checks see
        # SERVER-IP:8080 on both the Origin and forwarded host headers.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_read_timeout 120s;
    }
}
